name: Android checks

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@94baf225fe0a508e581a564467443d0e2379123b # v4.3.0
        with:
          # Keep CI aligned with gradle-wrapper.properties.
          gradle-version: '9.8.2'

      - name: Configure Firebase placeholders for source checks
        run: |
          # No real Firebase project configuration or credentials are needed in CI.
          cp collector/google-services.json.example collector/google-services.json
          cp receiver/google-services.json.example receiver/google-services.json

      - name: Run local unit tests
        run: gradle :shared:testDebugUnitTest :receiver:testDebugUnitTest --stacktrace

      - name: Run Android lint checks
        run: gradle :shared:lintDebug :collector:lintFullDebug :collector:lintLiteDebug :receiver:lintDebug -PcompatibilityLint --stacktrace

      - name: Test signing safeguards with a disposable key
        run: python3 -m unittest discover -s scripts -p 'test_apk_signing.py' -v

      # Intentionally no assemble, package, emulator-install, upload, or release steps.
      # Contributors build and install APKs locally when they choose to.
