name: Firebase security rules
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned test dependencies
        working-directory: security-tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test deny-by-default rules against disposable emulator
        working-directory: security-tests
        run: npx firebase emulators:exec --config ../firebase.json --project demo-phonebridge-security --only firestore 'npm test'
