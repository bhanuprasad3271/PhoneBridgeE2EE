name: Firebase security rules
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rules:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Install pinned test dependencies
        working-directory: security-tests
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test deny-by-default rules against disposable emulator
        working-directory: security-tests
        run: npx firebase emulators:exec --config ../firebase.json --project demo-phonebridge-security --only firestore 'npm test'
