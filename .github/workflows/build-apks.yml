name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          gradle-version: '8.13'

      - name: Configure Firebase placeholders for build
        run: |
          # CI compiles and tests the source; it does not need access to anyone's Firebase project.
          cp collector/google-services.json.example collector/google-services.json
          cp receiver/google-services.json.example receiver/google-services.json

      - name: Test Receiver timeline logic
        run: gradle :receiver:testDebugUnitTest :receiver:assembleDebugAndroidTest --stacktrace

      - name: Check Android API compatibility in both apps
        run: gradle :shared:lintDebug :collector:lintFullDebug :collector:lintLiteDebug :receiver:lintDebug -PcompatibilityLint --stacktrace

      - name: Reserve disk space for Android emulator
        run: |
          # These preinstalled toolchains are unused by this Java/Kotlin build.
          # Remove them only on the disposable GitHub-hosted runner.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/swift /opt/ghc
          df -h /
          available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$available_kb" -lt 15728640 ]; then
            echo "::error::Need at least 15 GiB free before installing and booting the emulator."
            exit 1
          fi

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Android 11 encryption and app startup
        uses: reactivecircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # System-image minimums can exceed disk-size; reserve host disk above.
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            gradle :shared:connectedDebugAndroidTest :collector:assembleFullDebug :collector:assembleLiteDebug :collector:assembleFullDebugAndroidTest :collector:assembleLiteDebugAndroidTest :receiver:assembleDebug --stacktrace
            python3 scripts/test_sender_editions.py
            gradle :receiver:connectedDebugAndroidTest --stacktrace

      - name: Test signing safeguards with a disposable key
        run: python3 -m unittest discover -s scripts -p 'test_apk_signing.py' -v

      # CI builds are validation only; no APK artifacts are published.
      - name: Check APK compilation
        run: gradle :receiver:assembleDebug :collector:assembleFullDebug :collector:assembleLiteDebug --stacktrace
