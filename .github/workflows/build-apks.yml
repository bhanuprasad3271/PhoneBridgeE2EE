name: Build Android APKs

on:
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Restore Firebase config
        env:
          FIREBASE_COLLECTOR: ${{ secrets.FIREBASE_GOOGLE_SERVICES_COLLECTOR || secrets.FIREBASE_GOOGLE_SERVICES }}
          FIREBASE_RECEIVER: ${{ secrets.FIREBASE_GOOGLE_SERVICES_RECEIVER || secrets.FIREBASE_GOOGLE_SERVICES }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          for module, key in (("collector", "FIREBASE_COLLECTOR"), ("receiver", "FIREBASE_RECEIVER")):
              raw = os.environ.get(key, "")
              if not raw.strip():
                  raise SystemExit(f"Missing Firebase configuration for {module}")
              try:
                  config = json.loads(raw)
              except json.JSONDecodeError:
                  raise SystemExit(f"Invalid Firebase JSON for {module}")
              expected = f"com.phonebridge.{module}"
              packages = [c.get("client_info", {}).get("android_client_info", {}).get("package_name") for c in config.get("client", [])]
              if expected not in packages:
                  raise SystemExit(f"Firebase configuration does not include {expected}")
              Path(module, "google-services.json").write_text(raw)
          PY

      - name: Test Receiver timeline logic
        run: gradle :receiver:testDebugUnitTest --stacktrace

      - name: Check Android API compatibility in both apps
        run: gradle :shared:lintDebug :collector:lintFullDebug :collector:lintLiteDebug :receiver:lintDebug -PcompatibilityLint --stacktrace

      - name: Reserve disk space for Android emulator
        run: |
          # These preinstalled toolchains are unused by this Java/Kotlin build.
          # Remove them only on the disposable GitHub-hosted runner.
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/swift /opt/ghc
          df -h /
          available_kb=$(df -Pk / | awk 'NR==2 {print $4}')
          if [ "$available_kb" -lt 15728640 ]; then
            echo "::error::Need at least 15 GiB free before installing and booting the emulator."
            exit 1
          fi

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Test Android 11 encryption and app startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          # System-image minimums can exceed disk-size; reserve host disk above.
          disk-size: 2048M
          emulator-boot-timeout: 300
          disable-animations: true
          script: |
            gradle :shared:connectedDebugAndroidTest :collector:assembleFullDebug :collector:assembleLiteDebug :collector:assembleFullDebugAndroidTest :collector:assembleLiteDebugAndroidTest :receiver:assembleDebug --stacktrace
            python3 scripts/test_sender_editions.py

      - name: Test signing safeguards with a disposable key
        run: python3 -m unittest discover -s scripts -p 'test_apk_signing.py' -v

      # PR APKs have disposable debug certificates and must never be distributed.
      - name: Check APK compilation
        if: github.event_name == 'pull_request'
        run: gradle :receiver:assembleDebug :collector:assembleFullDebug :collector:assembleLiteDebug --stacktrace

      - name: Build and verify update APKs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          PHONEBRIDGE_REQUIRE_SIGNING: 'true'
          PHONEBRIDGE_VERSION_CODE_BASE: '2000'
          PHONEBRIDGE_KEYSTORE_PATH: ${{ runner.temp }}/phonebridge-signing.keystore
          PHONEBRIDGE_KEYSTORE_BASE64: ${{ secrets.PHONEBRIDGE_KEYSTORE_BASE64 }}
          PHONEBRIDGE_STORE_PASSWORD: ${{ secrets.PHONEBRIDGE_STORE_PASSWORD }}
          PHONEBRIDGE_KEY_ALIAS: ${{ secrets.PHONEBRIDGE_KEY_ALIAS }}
          PHONEBRIDGE_KEY_PASSWORD: ${{ secrets.PHONEBRIDGE_KEY_PASSWORD }}
          PHONEBRIDGE_SIGNING_SHA256: ${{ vars.PHONEBRIDGE_SIGNING_SHA256 }}
        run: |
          set -euo pipefail
          trap 'rm -f "$PHONEBRIDGE_KEYSTORE_PATH"' EXIT
          python3 scripts/apk_signing.py restore
          [[ "$PHONEBRIDGE_VERSION_CODE_BASE" =~ ^[0-9]+$ ]] || (echo "Invalid version code base" && exit 1)
          export PHONEBRIDGE_VERSION_CODE=$((PHONEBRIDGE_VERSION_CODE_BASE + GITHUB_RUN_NUMBER))
          gradle :receiver:assembleDebug :collector:assembleFullDebug :collector:assembleLiteDebug --stacktrace
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          test -n "$APKSIGNER"
          for apk in receiver/build/outputs/apk/debug/receiver-debug.apk collector/build/outputs/apk/full/debug/collector-full-debug.apk collector/build/outputs/apk/lite/debug/collector-lite-debug.apk; do
            python3 scripts/apk_signing.py verify "$APKSIGNER" "$apk"
          done
          {
            echo "Commit: $GITHUB_SHA"
            echo "Version code: $PHONEBRIDGE_VERSION_CODE"
            echo "Certificate SHA-256: $PHONEBRIDGE_SIGNING_SHA256"
          } > APK-BUILD.txt

      - name: Upload APKs
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: PhoneBridge-APKs
          path: |
            receiver/build/outputs/apk/debug/receiver-debug.apk
            collector/build/outputs/apk/full/debug/collector-full-debug.apk
            collector/build/outputs/apk/lite/debug/collector-lite-debug.apk
            APK-BUILD.txt
            docs/sender-editions.md

